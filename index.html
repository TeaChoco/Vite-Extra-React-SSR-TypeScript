<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/index.css" />
        <!--app-head-->
        <script>
            // Script to handle GitHub Pages SPA redirect
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search
                        .slice(1)
                        .split('&')
                        .map(function (s) {
                            return s.replace(/~and~/g, '&');
                        })
                        .join('?');
                    window.history.replaceState(
                        null,
                        null,
                        l.pathname.slice(0, -1) + decoded + l.hash,
                    );
                }
            })(window.location);
            (function () {
                const themeStore = localStorage.getItem('theme');
                const themeState = themeStore ? JSON.parse(themeStore) : null;
                const theme = themeState?.state?.theme || 'light';
                const isDarkSystem =
                    !theme && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (theme === 'dark' || isDarkSystem)
                    document.documentElement.classList.add('dark');
            })();
        </script>
    </head>
    <body>
        <div id="root"><!--app-html--></div>
        <script type="module" src="/src/entry-client.tsx"></script>
    </body>
</html>
